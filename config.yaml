# =============================================================
#  Global Toon 설정 파일
#  - 비밀값(API 키, 토큰)은 여기에 쓰지 말고 GitHub Secrets에 넣으세요.
# =============================================================

account:
  name: "글로벌툰"                 # 표지/마지막 컷에 표시될 계정 이름
  handle: "@globaltoonstoday"      # 인스타그램 아이디
  mascot_name: "지구톤"             # 해설 캐릭터 이름

# 하루 3회 슬롯 (GitHub Actions cron과 이름을 맞춤)
#  categories: 해당 슬롯에서 우선 고려할 뉴스 분야
slots:
  morning:
    label: "아침 국내 주요 이슈(경제·사회·생활)"
    categories: [business, nation, technology]
  noon:
    label: "점심 세계 주요 뉴스"
    categories: [world, science]
  evening:
    label: "저녁 테크·과학·문화·스포츠 이슈"
    categories: [technology, science, entertainment, sports]

# 뉴스 수집 (모두 무료 RSS, 키 불필요)
news:
  max_items_per_feed: 30
  lookback_hours: 30
  min_sources: 3            # 서로 다른 언론사 3곳 이상이 보도한 이슈만 후보(교차 검증)
  feeds:
    nation:
      - https://news.google.com/rss/headlines/section/topic/NATION?hl=ko&gl=KR&ceid=KR:ko
    business:
      - https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko
    world:
      - https://news.google.com/rss/headlines/section/topic/WORLD?hl=ko&gl=KR&ceid=KR:ko
      - https://news.google.com/rss/headlines/section/topic/WORLD?hl=en-US&gl=US&ceid=US:en
      - https://feeds.bbci.co.uk/news/world/rss.xml
    technology:
      - https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=ko&gl=KR&ceid=KR:ko
      - https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=en-US&gl=US&ceid=US:en
    science:
      - https://news.google.com/rss/headlines/section/topic/SCIENCE?hl=ko&gl=KR&ceid=KR:ko
    entertainment:
      - https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=ko&gl=KR&ceid=KR:ko
    sports:
      - https://news.google.com/rss/headlines/section/topic/SPORTS?hl=ko&gl=KR&ceid=KR:ko

# 대본 작성 LLM (Google Gemini 무료 티어)
#  - 앞에서부터 시도하고 429/오류면 다음 모델로 넘어감
#  - 무료 한도는 프로젝트마다 다르니 Google AI Studio에서 확인
llm:
  models:
    - gemini-flash-latest
    - gemini-flash-lite-latest
    - gemini-2.5-flash-lite
    - gemini-2.5-flash
  temperature: 0.8

# 게시 형식: reels(세로 영상 + 배경음악, 권장) | carousel(이미지 여러 장)
output:
  format: reels

# 릴스 영상 설정
reels:
  width: 1080
  height: 1920             # 9:16 세로 영상
  safe_top: 220            # 인스타 상단 UI에 가리지 않도록 내용 시작 위치
  fps: 30
  cover_sec: 2.5           # 표지 노출 시간
  base_sec: 2.2            # 장면 기본 시간 + 글자당 시간 → 3.5~6.5초 사이
  sec_per_char: 0.07
  min_sec: 3.5
  max_sec: 6.5
  outro_sec: 4.5
  transition: fade         # 장면 전환 효과 (fade | slideleft | smoothleft 등)
  transition_sec: 0.4
  zoom: 0.06               # 장면마다 천천히 6% 확대
  music_volume: 0.35       # 배경음악 크기 (0~1)
  crf: 22                  # 화질(낮을수록 고화질·대용량)

# 웹툰 구성 (carousel일 때 크기, reels일 때는 위 reels 크기로 자동 변경)
comic:
  max_images: 6             # 게시물 전체 장수 상한 (표지 1 + 본문 + 요약 1)
  panels: 4                 # 본문 컷 수 → 총 6장
  width: 1080
  height: 1350              # 4:5 세로형 (인스타 피드 최대 비율)
  jpeg_quality: 92
  theme_color: "#FF5A36"
  style_prompt: >-
    full color 2D comic book panel, korean webtoon illustration, hand-drawn cartoon style,
    clean bold black ink outlines, flat cel shading, bright saturated colors,
    expressive funny cartoon faces, slapstick comedy, simple clear composition,
    NOT 3D, NOT CGI render, NOT toy figure, NOT photorealistic
  layout_prompt: >-
    characters in the lower two thirds of the frame, plain simple background in the top third,
    one clear action, easy to understand at a glance, no text, no letters, no speech bubbles,
    no watermark, no signature

# 이미지 생성 — Cloudflare Workers AI (무료 1만 뉴런/일)
#  배경은 실사 사진을 쓰므로, 이 설정은 진행자 표정·동작 이미지를 처음 1회 만들 때만 사용
image:
  models: [flux-2-dev, flux-2-klein-4b, flux-1-schnell]
  width: 896
  height: 1152               # 세로 컷(인스타 4:5에 맞춤)
  steps_dev: 20

# 진행자 캐릭터 (assets/characters/ 의 그림 사용) — 이름·성격은 자유롭게 수정
characters:
  M:
    name: "준"
    look: "a young korean man with fluffy dark brown hair, big brown eyes, navy blazer over white t-shirt"
    personality: "호기심 많고 장난기 있는 기자. 신문을 들고 다니며 드립을 잘 친다"
  F:
    name: "하나"
    look: "a young korean woman with wavy shoulder-length brown hair, pearl earrings, beige blazer over white top"
    personality: "똑 부러지고 친절한 앵커. 마이크를 들고 핵심을 쉽게 정리한다"

# 배경 실사 사진 — 무료 라이선스(상업 이용 가능, 사진가·사이트 출처 자동 표기)
#  pixabay(기본, 키: PIXABAY_API_KEY) | pexels(키: PEXELS_API_KEY — 2026년 신규 발급 중단)
photos:
  provider: pixabay

# 인스타그램 게시
instagram:
  # 2026년 신규 Meta 앱은 "통합 로그인(Unified login)" → 비즈니스 포트폴리오의 시스템 사용자 토큰(만료 없음) 사용
  api: facebook_login         # facebook_login(graph.facebook.com) | instagram_login(graph.instagram.com, 구형 앱)
  version: "v25.0"
  # 이미지 공개 URL 방식: jsdelivr(권장) | raw
  image_host: jsdelivr

# 콘텐츠 안전 규칙 (대본 프롬프트에 그대로 들어감)
safety:
  max_attempts: 2           # 팩트체크 탈락 시 다른 이슈로 재시도 횟수
  # [중간 완화] 정치·외교·통상·경제정책·기업 뉴스는 허용(사실 위주·중립). 아래만 제외
  skip_topics:
    - "사망·사고·재난 희생, 테러·전투·폭격 등 전쟁 참상"
    - "범죄·성범죄·아동 관련 사건, 수사·재판 중인 형사 사건"
    - "확인되지 않은 의혹·루머"
    - "정당 간 공방, 특정 정당·정치인 지지 또는 비난"
    - "젠더·종교·지역 혐오 갈등"
  # 제목·관련 제목에 들어 있으면 후보에서 자동 제외 (1차 필터)
  avoid_keywords: [사망, 숨져, 숨진, 참사, 희생자, 사상자, 사고, 화재, 폭발, 공습, 폭격, 미사일, 교전, 테러, 총격, 살해,
    성폭, 성추행, 성희롱, 학대, 아동, 마약, 실종, 피해자, 혐의, 피소, 기소, 구속, 체포, 수사, 재판, 의혹, 루머,
    공방, 막말, 혐오, 젠더, 페미, 해킹, 사이버공격, 난사, 간첩, 불륜, 횡령,
    killed, dead, death, dies, died, shooting, gunman, airstrike, missile, bombing, terror, terrorist, attack,
    rape, sexual, abuse, assault, harassment, grooming, accused, allegation, allegations, alleged, arrest, arrested,
    charged, trial, drug, drugs, victim, victims, injured, missing, hack, hacked, cyberattack, spy, scandal, war]
  # 위 금지어를 포함해도 허용하는 표현 (예: 무역전쟁은 경제 뉴스)
  allow_phrases: [무역전쟁, 관세전쟁, 가격전쟁, 환율전쟁, 쩐의 전쟁, trade war, price war, tariff war, chip war, 사고팔]
  rules:
    - "가벼운 소식은 유머 있게, 무거운 소식(외교·경제위기 등)은 차분한 해설 톤으로. 특정 집단·인물을 놀리지 않는다."
    - "그림 장면은 인물 1~2명, 동작 1개로 단순하게. 한눈에 이해되게."
    - "배경 사진 검색어에는 실존 인물 이름·브랜드·로고를 넣지 않는다(장소·사물·풍경 위주)."
    - "제공된 기사 제목·요약에 없는 사실을 지어내지 않는다."
    - "정치·외교·통상 이슈는 사실과 각 측 입장만 균형 있게 전달하고, 평가·조롱·편들기를 하지 않는다."
    - "기사 문장을 그대로 베끼지 않고 쉬운 말로 다시 쓴다."
